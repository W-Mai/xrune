name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # the Forge compiles the crates themselves; keep it in step with them
      - "crates/**"
      - "xtask/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            docs/forge -> target

      - name: Install mdbook
        uses: taiki-e/cache-cargo-install-action@v2
        with: { tool: mdbook }
      - name: Install mdbook-mermaid
        uses: taiki-e/cache-cargo-install-action@v2
        with: { tool: mdbook-mermaid }

      # Landing page + fonts, the Forge (the parser as wasm) and both
      # mdBook trees. Run the same command locally to preview the site.
      - name: Assemble the site
        run: cargo xtask site --out pages --book

      # The extended build splits Chinese into words. The plain one keeps each
      # unbroken run of hanzi as a single word, so 中文 queries miss most pages.
      - name: Install Pagefind
        run: |
          curl -fsSL https://github.com/CloudCannon/pagefind/releases/download/v1.4.0/pagefind_extended-v1.4.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin
      # Every page carries the menu bar and the shortcut help outside <main>;
      # left in, "navy" or "shortcuts" matches every page.
      - name: Index the search
        run: |
          for book in pages/book pages/book/zh-CN; do
            pagefind_extended --site "$book" \
              --exclude-selectors '#mdbook-menu-bar' --exclude-selectors '#mdbook-help-container'
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
